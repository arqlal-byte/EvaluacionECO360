<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b42"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Prueba ECO"><link rel="manifest" href="./manifest.webmanifest"><title>Prueba PWA ECO</title><style>*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,Arial;background:#f2f6f3;color:#153b2b;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}main{max-width:520px;margin:10vh auto;background:white;border-radius:24px;padding:26px;box-shadow:0 8px 30px #143e2317}h1{font-size:26px}button{background:#176b42;color:white;border:0;border-radius:12px;padding:14px 18px;font-size:16px}p{line-height:1.5}.status{font-weight:700}</style></head><body><main><h1>Prueba técnica PWA</h1><p>Esta pantalla no utiliza información ni logotipos de Persona ECO.</p><p id="mode" class="status">Comprobando modo de apertura…</p><button id="test">Probar navegación interna</button><p id="result"></p><p>Comunicación con Apps Script: <strong id="conexion">Sin comprobar</strong>.</p><button id="ping" type="button">Comprobar conexión</button><p id="detalle" role="status">La prueba solo solicita una respuesta técnica; no envía información personal.</p></main><script>const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;document.getElementById('mode').textContent=installed?'Abierta desde el ícono (modo independiente)':'Abierta desde el navegador';document.getElementById('test').onclick=()=>{document.getElementById('result').textContent='La navegación JavaScript funciona sin salir de esta página.'};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const endpoint='https://script.google.com/macros/s/AKfycbyNdB0GiEY80Km9ZWxsvamW0YPOPSxCtvLwdozxf6LT3zDCWVm3SbJPCzwfhykXIlO9/exec';document.getElementById('ping').onclick=()=>{const status=document.getElementById('conexion'),detail=document.getElementById('detalle');status.textContent='Comprobando…';const cb='ecoPwaCb_'+Math.random().toString(36).slice(2,14);const s=document.createElement('script');let done=false;const finish=(a,b)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();status.textContent=a;detail.textContent=b;};window[cb]=data=>finish(data&&data.ok===true&&data.prueba==='ecoPwaPingV1'?'Conexión verificada':'Respuesta inesperada',data&&data.ok===true?'Apps Script respondió a la prueba pública. Esto no valida todavía el acceso autenticado.':'No se recibió la respuesta esperada.');s.onerror=()=>finish('Error de conexión','Comprueba que el despliegue permita acceso a la prueba.');const timer=setTimeout(()=>finish('Tiempo agotado','No llegó respuesta en 15 segundos.'),15000);s.src=endpoint+'?accion=ecoPwaPingV1&callback='+encodeURIComponent(cb);document.head.appendChild(s);};</script></body></html>
